			shellScript = "FRAMEWORKS_DIR=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Frameworks\"\nAPP_RES=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nif [ -d \"$FRAMEWORKS_DIR\" ]; then\n  for framework in \"$FRAMEWORKS_DIR\"/*.framework; do\n    if [ -f \"$framework/Info.plist\" ]; then\n      fw_name=$(basename \"$framework\" .framework)\n\n      # 整理 framework 标准结构：Versions/Current/Resources + 符号链接\n      mkdir -p \"$framework/Versions/Current/Resources\"\n      if [ ! -f \"$framework/Versions/Current/Resources/Info.plist\" ]; then\n        mv \"$framework/Info.plist\" \"$framework/Versions/Current/Resources/Info.plist\"\n        ln -sf \"Versions/Current/Resources/Info.plist\" \"$framework/Info.plist\"\n      fi\n      if [ ! -L \"$framework/Resources\" ]; then\n        ln -sf \"Versions/Current/Resources\" \"$framework/Resources\"\n      fi\n\n      # 镜像 SPM 生成本地化资源（zh.lproj 等）到 framework\n      SPM_BUNDLE=\"${BUILT_PRODUCTS_DIR}/${fw_name}_${fw_name}.bundle\"\n      if [ -d \"$SPM_BUNDLE/Contents/Resources\" ]; then\n        echo \"Mirroring resources from $SPM_BUNDLE to $framework/Versions/Current/Resources\"\n        rsync -a \"$SPM_BUNDLE/Contents/Resources/\" \"$framework/Versions/Current/Resources/\" 2>/dev/null || \\\n          cp -R \"$SPM_BUNDLE/Contents/Resources/\" \"$framework/Versions/Current/Resources/\" 2>/dev/null || true\n        PKG_FW=\"${BUILT_PRODUCTS_DIR}/PackageFrameworks/${fw_name}.framework/Versions/Current/Resources\"\n        if [ -d \"$PKG_FW\" ]; then\n          rsync -a \"$SPM_BUNDLE/Contents/Resources/\" \"$PKG_FW/\" 2>/dev/null || true\n        fi\n        rm -rf \"$APP_RES/${fw_name}_${fw_name}.bundle\" 2>/dev/null || true\n      fi\n\n      # 整理可执行文件、Headers、Modules 到 Versions/Current\n      execName=$(basename \"$framework\" .framework)\n      if [ -f \"$framework/$execName\" ] && [ ! -L \"$framework/$execName\" ]; then\n        mv \"$framework/$execName\" \"$framework/Versions/Current/$execName\"\n        ln -sf \"Versions/Current/$execName\" \"$framework/$execName\"\n      fi\n      if [ -d \"$framework/Headers\" ] && [ ! -L \"$framework/Headers\" ]; then\n        mv \"$framework/Headers\" \"$framework/Versions/Current/Headers\"\n        ln -sf \"Versions/Current/Headers\" \"$framework/Headers\"\n      fi\n      if [ -d \"$framework/Modules\" ] && [ ! -L \"$framework/Modules\" ]; then\n        mv \"$framework/Modules\" \"$framework/Versions/Current/Modules\"\n        ln -sf \"Versions/Current/Modules\" \"$framework/Modules\"\n      fi\n      if [ -d \"$framework/_CodeSignature\" ]; then\n        rm -rf \"$framework/_CodeSignature\"\n      fi\n      find \"$framework\" -name \".DS_Store\" -delete 2>/dev/null || true\n    fi\n  done\nfi\n";
